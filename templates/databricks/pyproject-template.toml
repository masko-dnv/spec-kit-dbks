[project]
name = "[PROJECT_NAME]"
version = "0.1.0"
description = "Databricks data engineering pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Production dependencies only - these run in Databricks clusters
    # Most packages are pre-installed in Databricks Runtime
    # Add custom packages here as needed
]

[dependency-groups]
dev = [
    # Databricks local development - match your cluster runtime version
    "databricks-connect==14.3.*",  # Update to match your DBR version
    "databricks-sdk>=0.30.0",
    
    # Testing & quality assurance
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    
    # Notebooks & interactive development
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipython>=8.0.0",
    
    # Code quality & formatting
    "ruff>=0.1.0",
    "black>=23.0.0",
    
    # Development utilities
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",       # For local testing & data manipulation
    "pydantic>=2.0.0",     # Data validation
    "loguru>=0.7.0",       # Enhanced logging
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/[PACKAGE_NAME]"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: marks tests as integration tests (requires Databricks connection)",
    "unit: marks tests as unit tests (no external dependencies)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

# Databricks built-in globals - prevents F821 (undefined name) errors
builtins = [
    "spark",          # SparkSession
    "dbutils",        # Databricks utilities
    "display",        # Display function for Databricks notebooks
    "displayHTML",    # Display HTML in notebooks
    "sc",             # SparkContext
    "sqlContext",     # SQLContext (legacy)
    "table",          # Reference table
    "udf",            # User-defined functions
    "getArgument",    # Get notebook arguments
]

exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    "docs",
    "resources",
    "scratch",
    ".vscode",
    ".git",
    ".github",
    ".databrickscfg",
    "*.ipynb",          # Jupyter notebooks
    ".ipynb_checkpoints",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "F821",  # undefined name (Databricks builtins)
]

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = ["F401"]  # Allow unused imports in __init__.py for re-exports

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | venv
  | scratch
  | \.ipynb_checkpoints
)/
'''

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "databricks.*",
    "pyspark.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
skip_covered = true
precision = 2
